name: test

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

# Tests only read the code; the token needs no write access.
permissions:
  contents: read

# A newer push to the same branch or PR replaces a run that is still going.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    strategy:
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
        node: [22, 24]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 15
    steps:
      # Actions pinned to a commit (a tag can be moved); Dependabot keeps them current.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: ${{ matrix.node }}
      # Installs the API SDKs too, so the tests also check the calls the app makes into them.
      - run: npm ci
      - run: npm test
      - run: npm run lint
        if: matrix.os == 'ubuntu-latest' && matrix.node == 24
